name: Daily Brief Auto Build & Deploy

on:
  schedule:
    # 每天 08:00 北京时间（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser

      - name: Build brief HTML
        working-directory: scripts
        run: |
          python build_brief.py \
            --date "$(TZ=Asia/Shanghai date +%Y%m%d)" \
            --out ../public/index.html \
            --briefs-json ../data/briefs.json

      - name: Commit briefs history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/briefs.json public/index.html
          git diff --cached --quiet || git commit -m "chore: daily brief $(TZ=Asia/Shanghai date +%Y-%m-%d) [skip ci]"
          git push

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name=daily-brief \
            --branch=main
